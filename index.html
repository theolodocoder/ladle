<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladle · Menu coverage</title>
<meta name="description" content="Ladle keeps school lunch menus covered: supplier scorecards, at-risk meals with rule-checked substitutes, delivery evidence, director approvals and an audit log.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F6F8; --surface:#FFFFFF; --ink:#18212E; --ink-2:#475467; --muted:#7A8699; --line:#E3E7ED; --line-2:#CFD6DF;
    --green:#1F5F4A; --green-ink:#174A3A; --green-soft:#E7F1EC;
    --bus:#F2B705; --bus-soft:#FFF6D6; --bus-ink:#7A5B00;
    --red:#B42318; --red-soft:#FDECEA;
    --r-sm:6px; --r:10px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 "Public Sans",system-ui,sans-serif; color:var(--ink); background:var(--bg); font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased; }
  button, input, textarea, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--green); outline-offset:2px; }
  .app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100%; }

  /* sidebar */
  .side { background:var(--ink); color:#C9D1DC; display:flex; flex-direction:column; padding:14px 10px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 14px; }
  .brand svg { flex:none; }
  .brand b { color:#fff; font-size:17px; letter-spacing:-.01em; }
  .district { display:flex; align-items:center; justify-content:space-between; width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:var(--r-sm); padding:8px 10px; color:#fff; text-align:left; cursor:pointer; margin-bottom:14px; }
  .district small { display:block; color:#9AA6B6; font-size:12px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; color:inherit; padding:8px 10px; border-radius:var(--r-sm); cursor:pointer; text-align:left; }
  .nav button:hover { background:rgba(255,255,255,.05); }
  .nav button[aria-current=page] { background:rgba(255,255,255,.1); color:#fff; font-weight:600; }
  .nav .n { margin-left:auto; background:var(--bus); color:var(--ink); border-radius:999px; font-size:11.5px; font-weight:700; padding:0 7px; line-height:18px; }
  .me { margin-top:auto; position:relative; }
  .me > button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; color:#fff; padding:8px; border-radius:var(--r-sm); cursor:pointer; text-align:left; }
  .me > button:hover { background:rgba(255,255,255,.05); }
  .av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
  .me small { display:block; color:#9AA6B6; font-size:12px; }
  .menu { position:absolute; bottom:52px; left:0; right:0; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 12px 32px rgba(16,24,40,.18); padding:6px; }
  .menu p { margin:4px 8px 6px; font-size:12px; color:var(--muted); }
  .menu button { display:flex; gap:10px; align-items:center; width:100%; border:0; background:none; padding:7px 8px; border-radius:var(--r-sm); cursor:pointer; text-align:left; }
  .menu button:hover { background:var(--bg); }
  .menu button[aria-checked=true] { background:var(--green-soft); }

  /* main */
  .main { min-width:0; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:12px; padding:14px 28px; border-bottom:1px solid var(--line); background:var(--surface); }
  .top h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em; }
  .top .sub { color:var(--ink-2); }
  .sandbox { margin-left:auto; font-size:12px; font-weight:600; color:var(--bus-ink); background:var(--bus-soft); border:1px solid #F5DE8A; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .page { padding:20px 28px 40px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:#fff; border-radius:var(--r-sm); padding:7px 12px; font-weight:600; cursor:pointer; }
  .btn:hover { background:var(--bg); }
  .btn.primary { background:var(--green); border-color:var(--green); color:#fff; }
  .btn.primary:hover { background:var(--green-ink); }
  .btn.danger { color:var(--red); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .tag.ok { background:var(--green-soft); color:var(--green); }
  .tag.risk { background:var(--bus-soft); color:var(--bus-ink); }
  .tag.bad { background:var(--red-soft); color:var(--red); }
  .tag.grey { background:#EEF1F5; color:var(--ink-2); }

  /* coverage calendar: the signature element */
  .cov { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:20px; align-items:start; }
  .weeks { padding:16px; }
  .weekhead { display:flex; justify-content:space-between; align-items:baseline; margin:4px 2px 8px; }
  .weekhead h2 { margin:0; font-size:14px; font-weight:600; }
  .weekhead span { color:var(--muted); font-size:13px; }
  .days { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-bottom:18px; }
  .day { position:relative; text-align:left; border:1px solid var(--line); background:#fff; border-radius:var(--r); padding:10px 10px 12px; cursor:pointer; min-height:132px; display:flex; flex-direction:column; gap:6px; }
  .day:hover { border-color:var(--line-2); }
  .day .d { display:flex; justify-content:space-between; align-items:baseline; }
  .day .d b { font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .day .d span { color:var(--muted); font-size:12.5px; }
  .day ul { list-style:none; margin:0; padding:0; font-size:12.5px; color:var(--ink-2); }
  .day li { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .day li.hit { color:var(--ink); font-weight:600; }
  .day.at-risk { background:var(--bus-soft); border-color:#EFD27A; box-shadow:inset 0 4px 0 var(--bus); }
  .day.pending { box-shadow:inset 0 4px 0 #9AA6B6; }
  .day.fixed { box-shadow:inset 0 4px 0 var(--green); }
  .day[aria-pressed=true] { outline:2px solid var(--ink); outline-offset:1px; }
  .day .foot { margin-top:auto; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; color:var(--ink-2); font-size:12.5px; padding:0 2px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }

  /* detail */
  .detail { position:sticky; top:16px; }
  .detail header { padding:16px 16px 12px; border-bottom:1px solid var(--line); }
  .detail h2 { margin:0 0 2px; font-size:16px; }
  .detail .meta { color:var(--ink-2); font-size:13px; }
  .detail section { padding:14px 16px; border-bottom:1px solid var(--line); }
  .detail section:last-child { border-bottom:0; }
  .detail h3 { margin:0 0 8px; font-size:13px; font-weight:600; color:var(--ink-2); }
  .problem { display:flex; gap:10px; background:var(--bus-soft); border:1px solid #F5DE8A; border-radius:var(--r-sm); padding:10px; font-size:13px; }
  .meter { height:6px; background:#fff; border-radius:999px; overflow:hidden; margin-top:6px; border:1px solid #EFD27A; }
  .meter i { display:block; height:100%; background:var(--bus); }
  .opts { display:flex; flex-direction:column; gap:6px; }
  .opt { display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:10px; align-items:start; border:1px solid var(--line); border-radius:var(--r-sm); padding:10px; cursor:pointer; }
  .opt:has(input:checked) { border-color:var(--green); background:#FAFCFB; }
  .opt.off { cursor:not-allowed; opacity:.75; }
  .opt input { margin:2px 0 0; accent-color:var(--green); }
  .opt b { display:block; font-weight:600; }
  .opt small { color:var(--ink-2); font-size:12.5px; }
  .opt .price { font-weight:600; text-align:right; }
  .facts { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .facts li { display:grid; grid-template-columns:16px minmax(0,1fr); gap:8px; }
  .facts small { display:block; color:var(--muted); font-size:12px; }
  .facts li.q { color:var(--bus-ink); }
  .ico { width:16px; height:16px; margin-top:1px; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .status { font-size:13px; color:var(--ink-2); }

  /* tables */
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:600; font-size:12.5px; color:var(--ink-2); padding:10px 14px; border-bottom:1px solid var(--line); background:#FAFBFC; white-space:nowrap; }
  td { padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr.click { cursor:pointer; }
  tbody tr.click:hover td { background:#FAFBFC; }
  tbody tr.sel td { background:var(--green-soft); }
  .r { text-align:right; }
  .score { display:inline-flex; align-items:center; gap:8px; }
  .score i { display:inline-block; width:56px; height:6px; background:#EEF1F5; border-radius:999px; overflow:hidden; }
  .score i b { display:block; height:100%; background:var(--green); }
  .scroll { overflow-x:auto; }
  td b { white-space:nowrap; }
  .sup { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start; }
  .weights { padding:12px 14px; border-bottom:1px solid var(--line); }
  .weights summary { cursor:pointer; font-weight:600; color:var(--ink-2); font-size:13px; }
  .weights .g { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:10px; }
  .weights label { font-size:12.5px; color:var(--ink-2); display:flex; justify-content:space-between; }
  .weights input { width:100%; accent-color:var(--green); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0; font-size:13px; }
  .kv dt { color:var(--ink-2); } .kv dd { margin:0; text-align:right; font-weight:600; }

  /* approvals */
  .inbox { max-width:880px; }
  .req { padding:16px; border-bottom:1px solid var(--line); }
  .req:last-child { border-bottom:0; }
  .req .h { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .req h3 { margin:0; font-size:14.5px; }
  .req p { margin:4px 0 0; color:var(--ink-2); font-size:13px; }
  .req textarea { width:100%; min-height:64px; border:1px solid var(--line-2); border-radius:var(--r-sm); padding:8px 10px; margin:10px 0 8px; resize:vertical; }
  .req textarea[aria-invalid=true] { border-color:var(--red); }
  .err { color:var(--red); font-size:12.5px; margin:-4px 0 8px; }
  .quote { margin-top:10px; padding-left:10px; border-left:3px solid var(--line-2); color:var(--ink); font-size:13px; }
  .empty { padding:36px 16px; text-align:center; color:var(--ink-2); }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--ink); color:#fff; padding:10px 14px; border-radius:var(--r-sm); font-size:13px; box-shadow:0 8px 24px rgba(16,24,40,.25); opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none; }
  .toast.on { opacity:1; transform:none; }
  [hidden] { display:none !important; }

  @media (max-width:1320px) { .sup { grid-template-columns:minmax(0,1fr); } }
  @media (max-width:1180px) { .cov, .sup { grid-template-columns:minmax(0,1fr); } .detail { position:static; } }
  @media (max-width:820px) {
    .app { grid-template-columns:minmax(0,1fr); }
    .side { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; }
    .brand { padding:0 6px 0 0; } .district { display:none; }
    .nav { flex-direction:row; overflow-x:auto; flex:1 1 100%; order:3; }
    .nav button { white-space:nowrap; width:auto; }
    .me { margin:0 0 0 auto; } .me small, .me .who { display:none; }
    .menu { bottom:auto; top:44px; left:auto; right:0; width:240px; z-index:5; }
    .top, .page { padding-left:16px; padding-right:16px; }
    .days { grid-template-columns:repeat(5,minmax(112px,1fr)); overflow-x:auto; }
    .weights .g { grid-template-columns:minmax(0,1fr); }
    .scroll { overflow-x:auto; }
  }
  @media (prefers-reduced-motion:reduce) { .toast { transition:none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#F2B705"/><path d="M7 11h12a6 6 0 0 1-12 0Z" fill="#18212E"/><path d="M17.5 11 21 5.5" stroke="#18212E" stroke-width="2.2" stroke-linecap="round"/></svg>
      <b>Ladle</b>
    </div>
    <button class="district" type="button" aria-label="District: Riverbend Unified">
      <span>Riverbend Unified<small>Food & Nutrition Services</small></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
    </button>
    <nav class="nav" aria-label="Main">
      <button data-go="coverage" aria-current="page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Menu coverage</button>
      <button data-go="suppliers"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Suppliers</button>
      <button data-go="approvals"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Approvals<span class="n" id="navCount" hidden></span></button>
      <button data-go="activity"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>Activity</button>
    </nav>
    <div class="me">
      <button type="button" id="meBtn" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="menu" id="meMenu" role="menu" hidden></div>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h1 id="title">Menu coverage</h1>
      <span class="sub" id="subtitle"></span>
      <span class="sandbox" title="Sample district and suppliers">Sandbox</span>
    </div>

    <div class="page" data-view="coverage">
      <div class="cov">
        <div class="panel weeks" id="weeks"></div>
        <aside class="panel detail" id="detail" aria-live="polite"></aside>
      </div>
    </div>

    <div class="page" data-view="suppliers" hidden>
      <div class="sup">
        <div class="panel">
          <details class="weights">
            <summary>Scoring weights</summary>
            <div class="g">
              <div><label for="wOn">On-time delivery <output id="oOn"></output></label><input id="wOn" type="range" min="0" max="100" value="50"></div>
              <div><label for="wFill">Complete orders <output id="oFill"></output></label><input id="wFill" type="range" min="0" max="100" value="30"></div>
              <div><label for="wSat">Kitchen rating <output id="oSat"></output></label><input id="wSat" type="range" min="0" max="100" value="20"></div>
            </div>
          </details>
          <div class="scroll"><table>
            <thead><tr><th>Supplier</th><th class="r">On-time</th><th class="r">Complete</th><th class="r">Rating</th><th>Score</th><th>Recommendation</th></tr></thead>
            <tbody id="supRows"></tbody>
          </table></div>
        </div>
        <aside class="panel detail" id="supDetail"></aside>
      </div>
    </div>

    <div class="page" data-view="approvals" hidden>
      <div class="panel inbox" id="inbox"></div>
    </div>

    <div class="page" data-view="activity" hidden>
      <div class="panel scroll"><table>
        <thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead>
        <tbody id="log"></tbody>
      </table></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- sample district data ----------
const USERS = {
  sam:  { name:'Sam Lee', role:'Buyer', initials:'SL', color:'#D9E8F5', ink:'#1D4E7A' },
  dana: { name:'Dana Brooks', role:'Director', initials:'DB', color:'#E7F1EC', ink:'#1F5F4A' },
}
const SUPPLIERS = [
  { id:'harvest', name:'Harvest Valley Foods', type:'Distributor', onTime:96, fill:94, rating:4.6, orders:58, late:2, short:4, ends:'Jun 30, 2027', note:'No missed lunches this quarter.' },
  { id:'prairie', name:'Prairie Grain Co.', type:'Manufacturer', onTime:91, fill:97, rating:4.3, orders:24, late:2, short:1, ends:'Mar 31, 2027', note:'Two late trucks after their October route change.' },
  { id:'coastal', name:'Coastal Dairy Supply', type:'Distributor', onTime:82, fill:86, rating:3.7, orders:41, late:7, short:6, ends:'Jan 31, 2027', note:'Late deliveries cluster on Mondays.' },
  { id:'metro', name:'Metro Fresh Distributors', type:'Distributor', onTime:68, fill:74, rating:2.9, orders:33, late:11, short:9, ends:'Dec 31, 2026', note:'Three shortages reached the serving line.' },
]
const DAYS = [
  { id:'d1', date:'Dec 1', dow:'Mon', menu:['Chicken tenders','Brown rice','Green beans','Milk'], risk:{ item:'Chicken tenders', hit:'Chicken tenders', component:'Meat/meat alternate, 2 oz eq', supplier:'metro', why:'Shortage', confirmed:840, need:2100 },
    subs:[
      { id:'s1', name:'Grilled chicken strips', supplier:'harvest', price:0.62, rules:[['Meat/meat alternate, 2 oz eq',true],['Sodium within weekly target',true]],
        facts:[[true,'In catalog','Catalog sync, Nov 20'],[true,'Delivers to all 6 schools on the Monday route','Route file, Nov 18'],[true,'2,400 servings on hand','Inventory feed, today 9:02 AM'],[true,'Arrives Fri, Nov 28','Order cut-off Tue 2 PM']] },
      { id:'s2', name:'Turkey meatballs', supplier:'coastal', price:0.55, rules:[['Meat/meat alternate, 2 oz eq',true],['Sodium within weekly target',true]],
        facts:[[true,'In catalog','Catalog sync, Nov 20'],[true,'Delivers to 4 of 6 schools','Route file, Nov 18'],[null,'How many servings are on hand?','Coastal sends no inventory feed'],[null,'Can Lincoln and Oak Park get a delivery before Monday?','Not on their Monday route']] },
      { id:'s3', name:'Breaded fish sticks', supplier:'metro', price:0.48, blocked:true, rules:[['Meat/meat alternate, 2 oz eq',true],['Sodium within weekly target',false],['Breading is whole-grain rich',false]],
        facts:[[true,'In catalog','Catalog sync, Nov 20']] },
    ] },
  { id:'d2', date:'Dec 2', dow:'Tue', menu:['Beef chili','Cornbread','Carrot sticks','Milk'] },
  { id:'d3', date:'Dec 3', dow:'Wed', menu:['Bean and cheese burrito','Salsa','Corn','Milk'], risk:{ item:'Whole-wheat tortillas', hit:'Bean and cheese burrito', component:'Grain, whole-grain rich', supplier:'prairie', why:'Truck delayed 2 days', confirmed:0, need:2050 },
    subs:[
      { id:'s4', name:'Whole-wheat tortillas, Sunfield brand', supplier:'harvest', price:0.21, rules:[['Grain, whole-grain rich',true],['Sodium within weekly target',true]],
        facts:[[true,'In catalog','Catalog sync, Nov 20'],[true,'Delivers to all 6 schools','Route file, Nov 18'],[true,'3,000 on hand','Inventory feed, today 9:02 AM'],[true,'Arrives Mon, Dec 1','Order cut-off Thu 2 PM']] },
      { id:'s5', name:'Brown rice bowl base', supplier:'prairie', price:0.18, rules:[['Grain, whole-grain rich',true],['Sodium within weekly target',true]],
        facts:[[true,'In catalog','Catalog sync, Nov 20'],[null,'Is this item on the delayed truck?','Prairie notice, Nov 24, lists the truck, not the items']] },
    ] },
  { id:'d4', date:'Dec 4', dow:'Thu', menu:['Cheese pizza','Side salad','Apple','Milk'] },
  { id:'d5', date:'Dec 5', dow:'Fri', menu:['Turkey sandwich','Baked chips','Orange','Milk'] },
  { id:'d6', date:'Dec 8', dow:'Mon', menu:['Spaghetti and meat sauce','Garden salad','Pear','Milk'] },
  { id:'d7', date:'Dec 9', dow:'Tue', menu:['Chicken teriyaki','Brown rice','Broccoli','Milk'] },
  { id:'d8', date:'Dec 10', dow:'Wed', menu:['Black bean tacos','Spanish rice','Pineapple','Milk'] },
  { id:'d9', date:'Dec 11', dow:'Thu', menu:['Baked potato bar','Chili','Steamed peas','Milk'] },
  { id:'d10', date:'Dec 12', dow:'Fri', menu:['Pancakes and turkey sausage','Hash browns','Banana','Milk'] },
]

// ---------- state ----------
const S = { user:'sam', view:'coverage', day:'d1', choice:{}, sup:'metro', w:{ on:50, fill:30, sat:20 }, reqs:[], log:[], seq:0 }
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
const me = () => USERS[S.user]
const sup = (id) => SUPPLIERS.find((s) => s.id === id)
const day = (id) => DAYS.find((d) => d.id === id)
const subOf = (id) => { for (const d of DAYS) for (const s of d.subs || []) if (s.id === id) return { d, s } }
const stamp = () => new Date().toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })
const record = (what) => S.log.unshift({ at:stamp(), who:`${me().name}, ${me().role}`, what })
const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400) }
const reqFor = (dayId) => S.reqs.find((r) => r.dayId === dayId && r.status !== 'rejected')
const I = {
  ok:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.4" aria-label="Confirmed"><path d="m5 12 4 4 10-10"/></svg>',
  no:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2.4" aria-label="Fails"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  q:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#7A5B00" stroke-width="2.2" aria-label="Unconfirmed"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.5M12 17h.01"/></svg>',
}

function dayState(d) {
  if (!d.risk) return 'ok'
  const r = reqFor(d.id)
  return r ? (r.status === 'approved' ? 'fixed' : 'pending') : 'at-risk'
}

// ---------- coverage ----------
function renderWeeks() {
  const weeks = [DAYS.slice(0, 5), DAYS.slice(5)]
  const atRisk = DAYS.filter((d) => dayState(d) === 'at-risk').length
  $('#subtitle').textContent = S.view === 'coverage' ? (atRisk ? `${atRisk} of 10 school days at risk` : 'All 10 school days covered') : ''
  $('#weeks').innerHTML = weeks.map((w, i) => `
    <div class="weekhead"><h2>${i ? 'Next week' : 'This week'}</h2><span>${w[0].date} to ${w[4].date}</span></div>
    <div class="days">${w.map((d) => {
      const st = dayState(d)
      const tag = st === 'at-risk' ? '<span class="tag risk">At risk</span>' : st === 'pending' ? '<span class="tag grey">Pending approval</span>' : st === 'fixed' ? '<span class="tag ok">Swap approved</span>' : '<span class="tag ok">Covered</span>'
      return `<button class="day ${st}" data-day="${d.id}" aria-pressed="${S.day === d.id}">
        <span class="d"><b>${d.date.split(' ')[1]}</b><span>${d.dow}</span></span>
        <ul>${d.menu.map((m) => `<li class="${d.risk?.hit === m ? 'hit' : ''}">${esc(m)}</li>`).join('')}</ul>
        <span class="foot">${tag}</span></button>`
    }).join('')}</div>`).join('') +
    `<div class="legend"><span><i style="background:var(--bus)"></i>Supply problem, needs a substitute</span><span><i style="background:#9AA6B6"></i>Swap pending approval</span><span><i style="background:var(--green)"></i>Covered</span></div>`
}

function renderDetail() {
  const d = day(S.day), el = $('#detail')
  if (!d.risk) {
    el.innerHTML = `<header><h2>${d.dow}, ${d.date} lunch</h2><div class="meta">6 schools</div></header>
      <section><h3>Menu</h3><ul class="facts">${d.menu.map((m) => `<li>${I.ok}<span>${esc(m)}<small>Confirmed by supplier</small></span></li>`).join('')}</ul></section>`
    return
  }
  const r = d.risk, s0 = sup(r.supplier), req = reqFor(d.id)
  const pick = S.choice[d.id] || d.subs.find((s) => !s.blocked).id
  const chosen = d.subs.find((s) => s.id === pick)
  const open = chosen.facts.filter((f) => f[0] === null)
  el.innerHTML = `
    <header><h2>${d.dow}, ${d.date} lunch</h2><div class="meta">6 schools, ${r.need.toLocaleString()} servings</div></header>
    <section>
      <div class="problem">${I.q}<div><b>${esc(r.item)}: ${esc(r.why.toLowerCase())}</b><br>${esc(s0.name)} confirmed ${r.confirmed.toLocaleString()} of ${r.need.toLocaleString()} servings.
        <div class="meter"><i style="width:${Math.round(r.confirmed / r.need * 100)}%"></i></div></div></div>
    </section>
    <section>
      <h3>Substitutes for ${esc(r.component.toLowerCase())}</h3>
      <div class="opts" role="radiogroup">${d.subs.map((s) => {
        const unknown = s.facts.filter((f) => f[0] === null).length
        const state = s.blocked ? '<span class="tag bad">Fails meal pattern</span>' : unknown ? `<span class="tag risk">${unknown} unconfirmed</span>` : '<span class="tag ok">Deliverable</span>'
        return `<label class="opt ${s.blocked ? 'off' : ''}">
          <input type="radio" name="sub-${d.id}" value="${s.id}" ${s.id === pick ? 'checked' : ''} ${s.blocked || req ? 'disabled' : ''}>
          <span><b>${esc(s.name)}</b><small>${esc(sup(s.supplier).name)}</small><br>${state}</span>
          <span class="price">$${s.price.toFixed(2)}<br><small>per serving</small></span></label>`
      }).join('')}</div>
    </section>
    <section>
      <h3>Meal pattern</h3>
      <ul class="facts">${chosen.rules.map(([t, ok]) => `<li>${ok ? I.ok : I.no}<span>${esc(t)}</span></li>`).join('')}</ul>
    </section>
    <section>
      <h3>Can it reach every kitchen by ${d.dow}?</h3>
      <ul class="facts">${chosen.facts.map(([ok, t, src]) => `<li class="${ok === null ? 'q' : ''}">${ok === null ? I.q : I.ok}<span>${esc(t)}<small>${esc(src)}</small></span></li>`).join('')}</ul>
    </section>
    <section>
      ${req ? `<div class="status">${req.status === 'approved' ? `Approved by ${esc(req.decidedBy)}: “${esc(req.note)}”` : `Sent to Dana Brooks for approval on ${esc(req.at)}.`}</div>`
        : S.user === 'sam' ? `<div class="actions"><button class="btn primary" data-request="${d.id}">Request approval</button>${open.length ? `<span class="status">${open.length} question${open.length > 1 ? 's' : ''} go to the director with it</span>` : ''}</div>`
        : '<div class="status">Buyers request substitutes. You approve them in Approvals.</div>'}
    </section>`
}

// ---------- suppliers ----------
const score = (s) => { const w = S.w, t = w.on + w.fill + w.sat || 1; return Math.round((s.onTime * w.on + s.fill * w.fill + s.rating / 5 * 100 * w.sat) / t) }
const verdict = (n) => n >= 90 ? ['Renew', 'ok'] : n >= 80 ? ['Renew with terms', 'risk'] : ['Rebid', 'bad']
function renderSuppliers() {
  $('#oOn').textContent = S.w.on + '%'; $('#oFill').textContent = S.w.fill + '%'; $('#oSat').textContent = S.w.sat + '%'
  $('#supRows').innerHTML = [...SUPPLIERS].sort((a, b) => score(b) - score(a)).map((s) => {
    const n = score(s), [v, c] = verdict(n)
    return `<tr class="click ${S.sup === s.id ? 'sel' : ''}" data-sup="${s.id}" tabindex="0">
      <td><b>${esc(s.name)}</b><br><small style="color:var(--muted)">${s.type}</small></td>
      <td class="r">${s.onTime}%</td><td class="r">${s.fill}%</td><td class="r">${s.rating.toFixed(1)}</td>
      <td><span class="score"><b>${n}</b><i><b style="width:${n}%"></b></i></span></td>
      <td><span class="tag ${c}">${v}</span></td></tr>`
  }).join('')
  const s = sup(S.sup), n = score(s), [v, c] = verdict(n)
  const pending = S.reqs.find((r) => r.supId === s.id && r.status === 'pending')
  $('#supDetail').innerHTML = `
    <header><h2>${esc(s.name)}</h2><div class="meta">${s.type}, contract ends ${s.ends}</div></header>
    <section><span class="tag ${c}">${v}</span>
      <dl class="kv" style="margin-top:12px">
        <dt>Score</dt><dd>${n}</dd><dt>Orders, last 90 days</dt><dd>${s.orders}</dd><dt>Late deliveries</dt><dd>${s.late}</dd><dt>Short orders</dt><dd>${s.short}</dd><dt>Kitchen rating</dt><dd>${s.rating.toFixed(1)} of 5</dd>
      </dl></section>
    <section><h3>Notes</h3><div class="status">${esc(s.note)}</div></section>
    ${c !== 'ok' ? `<section>${pending ? '<div class="status">Renewal decision sent to Dana Brooks.</div>' : S.user === 'sam' ? `<button class="btn primary" data-renew="${s.id}">Send renewal decision</button>` : '<div class="status">Buyers send renewal decisions. You approve them in Approvals.</div>'}</section>` : ''}`
}

// ---------- approvals + activity ----------
function renderInbox() {
  const pending = S.reqs.filter((r) => r.status === 'pending').length
  const n = $('#navCount'); n.hidden = !pending; n.textContent = pending
  if (S.view === 'approvals') $('#subtitle').textContent = pending ? `${pending} waiting` : 'Nothing waiting'
  $('#inbox').innerHTML = S.reqs.length ? S.reqs.map((r) => `
    <article class="req">
      <div class="h"><div><h3>${esc(r.title)}</h3><p>${esc(r.detail)}</p><p>Requested by ${esc(r.by)}, ${esc(r.at)}</p></div>
        <span class="tag ${r.status === 'pending' ? 'risk' : r.status === 'approved' ? 'ok' : 'bad'}">${r.status === 'pending' ? 'Waiting' : r.status === 'approved' ? 'Approved' : 'Rejected'}</span></div>
      ${r.questions?.length ? `<ul class="facts" style="margin-top:10px">${r.questions.map((q) => `<li class="q">${I.q}<span>${esc(q)}</span></li>`).join('')}</ul>` : ''}
      ${r.status !== 'pending' ? `<div class="quote">${esc(r.decidedBy)}: ${esc(r.note)}</div>`
        : S.user === 'dana' ? `<label for="note-${r.id}" class="status" style="display:block;margin-top:10px">Reason for your decision</label>
          <textarea id="note-${r.id}"></textarea><div class="err" id="err-${r.id}" hidden>Add a reason before you approve or reject.</div>
          <div class="actions"><button class="btn primary" data-decide="${r.id}" data-ok="1">Approve</button><button class="btn danger" data-decide="${r.id}" data-ok="0">Reject</button></div>`
        : ''}
    </article>`).join('') : `<div class="empty">No requests yet. Buyers request substitutes from Menu coverage and renewal decisions from Suppliers.</div>`
}
function renderLog() {
  $('#log').innerHTML = S.log.length ? S.log.map((l) => `<tr><td style="white-space:nowrap">${esc(l.at)}</td><td style="white-space:nowrap">${esc(l.who)}</td><td>${esc(l.what)}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">No activity yet.</td></tr>'
}
function renderMe() {
  const u = me()
  $('#meBtn').innerHTML = `<span class="av" style="background:${u.color};color:${u.ink}">${u.initials}</span><span class="who">${u.name}<small>${u.role}</small></span>`
  $('#meMenu').innerHTML = `<p>Switch user</p>${Object.entries(USERS).map(([k, x]) => `<button role="menuitemradio" aria-checked="${k === S.user}" data-user="${k}"><span class="av" style="background:${x.color};color:${x.ink}">${x.initials}</span><span>${x.name}<small style="display:block;color:var(--muted);font-size:12px">${x.role}</small></span></button>`).join('')}`
}
const TITLES = { coverage:'Menu coverage', suppliers:'Suppliers', approvals:'Approvals', activity:'Activity' }
function render() {
  document.querySelectorAll('[data-view]').forEach((v) => v.hidden = v.dataset.view !== S.view)
  document.querySelectorAll('[data-go]').forEach((b) => b.setAttribute('aria-current', b.dataset.go === S.view ? 'page' : 'false'))
  $('#title').textContent = TITLES[S.view]; document.title = `Ladle · ${TITLES[S.view]}`
  $('#subtitle').textContent = S.view === 'suppliers' ? 'Last 90 days' : S.view === 'activity' ? 'Every request and decision' : ''
  renderMe(); renderWeeks(); renderDetail(); renderSuppliers(); renderInbox(); renderLog()
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, tr[data-sup]')
  if (!t) { if (!e.target.closest('.me')) { $('#meMenu').hidden = true; $('#meBtn').setAttribute('aria-expanded', 'false') } return }
  if (t.id === 'meBtn') { const m = $('#meMenu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return }
  if (t.dataset.user) { S.user = t.dataset.user; $('#meMenu').hidden = true; toast(`Signed in as ${me().name}`); render(); return }
  if (t.dataset.go) { S.view = t.dataset.go; render(); return }
  if (t.dataset.day) { S.day = t.dataset.day; render(); if (innerWidth < 1180) $('#detail').scrollIntoView({ behavior:'smooth', block:'start' }); return }
  if (t.dataset.request) {
    const d = day(t.dataset.request), s = d.subs.find((x) => x.id === (S.choice[d.id] || d.subs.find((y) => !y.blocked).id))
    const qs = s.facts.filter((f) => f[0] === null).map((f) => f[1])
    S.reqs.unshift({ id:++S.seq, dayId:d.id, title:`Substitute ${s.name} for ${d.risk.item.toLowerCase()}`, detail:`${d.dow}, ${d.date} lunch, ${sup(s.supplier).name}, ${d.risk.need.toLocaleString()} servings at $${s.price.toFixed(2)}`, questions:qs, by:me().name, at:stamp(), status:'pending' })
    record(`Requested ${s.name} for ${d.dow}, ${d.date} lunch`); toast('Approval requested'); render(); return
  }
  if (t.dataset.renew) {
    const s = sup(t.dataset.renew), [v] = verdict(score(s))
    S.reqs.unshift({ id:++S.seq, supId:s.id, title:`${v}: ${s.name}`, detail:`Score ${score(s)}. ${s.late} late and ${s.short} short of ${s.orders} orders. Contract ends ${s.ends}.`, by:me().name, at:stamp(), status:'pending' })
    record(`Sent renewal decision “${v}” for ${s.name}`); toast('Renewal decision sent'); render(); return
  }
  if (t.dataset.decide) {
    const r = S.reqs.find((x) => x.id === +t.dataset.decide), box = $('#note-' + r.id), note = box.value.trim()
    if (!note) { box.setAttribute('aria-invalid', 'true'); $('#err-' + r.id).hidden = false; box.focus(); return }
    r.status = t.dataset.ok === '1' ? 'approved' : 'rejected'; r.note = note; r.decidedBy = me().name
    record(`${r.status === 'approved' ? 'Approved' : 'Rejected'} “${r.title}”: ${note}`); toast(r.status === 'approved' ? 'Approved' : 'Rejected'); render(); return
  }
  if (t.dataset.sup) { S.sup = t.dataset.sup; renderSuppliers() }
})
document.addEventListener('change', (e) => { if (e.target.name?.startsWith('sub-')) { S.choice[e.target.name.slice(4)] = e.target.value; renderDetail() } })
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#meMenu').hidden = true; $('#meBtn').setAttribute('aria-expanded', 'false') }
  const tr = e.target.closest?.('tr[data-sup]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click() }
})
for (const [id, k] of [['wOn', 'on'], ['wFill', 'fill'], ['wSat', 'sat']]) $('#' + id).addEventListener('input', (e) => { S.w[k] = +e.target.value; renderSuppliers() })
render()
</script>
</body>
</html>
